name: Python application

on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"] 
        poetry-version: ["1.5.1"]

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookstore_dev
          POSTGRES_PASSWORD: bookstore_dev
          POSTGRES_DB: bookstore_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==${{ matrix.poetry-version }}

      - name: Configure environment
        run: |
          echo "DEBUG=1" >> $GITHUB_ENV
          echo "SECRET_KEY=uma-chave-secreta-aleatoria-para-testes" >> $GITHUB_ENV
          echo "SQL_ENGINE=django.db.backends.postgresql" >> $GITHUB_ENV
          echo "SQL_DATABASE=bookstore_db" >> $GITHUB_ENV
          echo "SQL_USER=bookstore_dev" >> $GITHUB_ENV
          echo "SQL_PASSWORD=bookstore_dev" >> $GITHUB_ENV
          echo "SQL_HOST=postgres" >> $GITHUB_ENV
          echo "SQL_PORT=5432" >> $GITHUB_ENV
          echo "DJANGO_SETTINGS_MODULE=bookstore.settings" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          poetry install --no-interaction
          poetry run pip install psycopg2-binary

      - name: Wait for PostgreSQL
        run: sleep 10 # Espera o PostgreSQL inicializar

      - name: Run tests

        run: poetry run python manage.py test
